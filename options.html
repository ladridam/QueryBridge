<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QueryBridge — Options</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 14px;
      padding: 24px;
      max-width: 480px;
    }
    input {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #saved-msg {
      margin-top: 10px;
      color: green;
      display: none;
    }
  </style>
</head>
<body>
  <h2>QueryBridge Settings</h2>
  <label for="api-key">Gemini API Key</label>
  <input type="password" id="api-key" placeholder="Paste your API key here" />
  <button id="save-btn">Save</button>
  <p id="saved-msg">Saved.</p>
  <script src="options.js"></script>
</body>
</html>
