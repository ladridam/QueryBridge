<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>QueryBridge — Options</title>
  <style>
    body {
      font-family: sans-serif;
      font-size: 14px;
      padding: 24px;
      max-width: 480px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      margin-top: 12px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #saved-msg {
      margin-top: 10px;
      color: green;
      display: none;
    }

    /*Search engine selection styles*/
    select {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      margin-top: 6px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
    }

    select:focus {
      border-color: #555;
    }

    #engine-status-msg {
      font-size: 13px;
      margin-top: 14px;
      min-height: 18px;
    }
  </style>
</head>

<body>
  <h2>QueryBridge Settings</h2>
  <label for="api-key">Gemini API Key</label>
  <input type="password" id="api-key" placeholder="Paste your API key here" />
  <button id="save-btn">Save</button>
  <p id="saved-msg">Saved.</p>
  <div style="margin-top: 28px;">
    <label>Preferred search engine</label>
    <p class="hint">Suggestions will open in this engine when clicked.</p>
    <select id="engine-select">
      <option value="google">Google</option>
      <option value="bing">Bing</option>
      <option value="duckduckgo">DuckDuckGo</option>
      <option value="yahoo">Yahoo</option>
      <option value="yandex">Yandex</option>
    </select>
    <div class="row">
      <button id="save-engine-btn">Save</button>
    </div>
    <p id="engine-status-msg"></p>
  </div>
  <script src="options.js"></script>
</body>

</html>
