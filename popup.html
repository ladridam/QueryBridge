<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>QueryBridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      background: #ffffff;
      color: #1a1a1a;
    }

    #header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #ebebeb;
    }

    #header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #1a1a1a;
    }

    #result-count {
      font-size: 11px;
      color: #aaa;
    }

    #original-query {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #body {
      padding: 10px 16px 14px;
    }

    #status {
      font-size: 13px;
      color: #999;
      padding: 10px 0;
      text-align: center;
    }

    .suggestion-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 7px;
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .suggestion-card:last-child {
      margin-bottom: 0;
    }

    .suggestion-card:hover {
      background: #f7f7f7;
      border-color: #d0d0d0;
    }

    .suggestion-text {
      font-size: 13px;
      color: #1a1a1a;
      line-height: 1.45;
      flex: 1;
    }

    .copy-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      padding: 3px 8px;
      color: #999;
      font-size: 11px;
      border-radius: 4px;
      transition: color 0.12s, border-color 0.12s;
    }

    .copy-btn:hover {
      color: #444;
      border-color: #bbb;
    }

    .copy-btn.copied {
      color: #2a7a2a;
      border-color: #2a7a2a;
    }

    #footer {
      padding: 8px 16px 11px;
      border-top: 1px solid #ebebeb;
      display: flex;
      justify-content: flex-end;
    }

    #options-link {
      font-size: 11px;
      color: #bbb;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      transition: color 0.12s;
    }

    #options-link:hover {
      color: #555;
    }

    .skeleton {
      height: 44px;
      background: #f3f3f3;
      border-radius: 8px;
      margin-bottom: 7px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.45;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1c1c1e;
        color: #f0f0f0;
      }

      #header {
        border-bottom-color: #2e2e2e;
      }

      #header h1 {
        color: #f0f0f0;
      }

      #original-query {
        color: #666;
      }

      #result-count {
        color: #555;
      }

      #status {
        color: #666;
      }

      .suggestion-card {
        border-color: #2e2e2e;
      }

      .suggestion-card:hover {
        background: #252527;
        border-color: #3a3a3a;
      }

      .suggestion-text {
        color: #e8e8e8;
      }

      .copy-btn {
        color: #666;
        border-color: #2e2e2e;
      }

      .copy-btn:hover {
        color: #bbb;
        border-color: #555;
      }

      .copy-btn.copied {
        color: #4caf50;
        border-color: #4caf50;
      }

      #footer {
        border-top-color: #2e2e2e;
      }

      #options-link {
        color: #444;
      }

      #options-link:hover {
        color: #aaa;
      }

      .skeleton {
        background: #2a2a2c;
      }
    }

    /* Error and no-key boxes */
    #error-box {
      display: none;
      padding: 10px 12px;
      background: #fff5f5;
      border: 1px solid #fdd;
      border-radius: 8px;
      margin-top: 4px;
    }

    #error-box p {
      font-size: 12px;
      color: #b00;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    #retry-btn {
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      color: #444;
      transition: background 0.12s;
    }

    #retry-btn:hover {
      background: #f5f5f5;
    }

    #no-key-box {
      display: none;
      padding: 10px 12px;
      background: #fffbf0;
      border: 1px solid #fde;
      border-radius: 8px;
      margin-top: 4px;
    }

    #no-key-box p {
      font-size: 12px;
      color: #885500;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    #go-to-options-btn {
      font-size: 12px;
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      color: #444;
      transition: background 0.12s;
    }

    #go-to-options-btn:hover {
      background: #f5f5f5;
    }

    @media (prefers-color-scheme: dark) {
      #error-box {
        background: #2a1a1a;
        border-color: #4a2020;
      }

      #error-box p {
        color: #f08080;
      }

      #retry-btn {
        background: #2a2a2c;
        border-color: #3a3a3a;
        color: #ccc;
      }

      #retry-btn:hover {
        background: #333;
      }

      #no-key-box {
        background: #2a2010;
        border-color: #4a3a10;
      }

      #no-key-box p {
        color: #d4a040;
      }

      #go-to-options-btn {
        background: #2a2a2c;
        border-color: #3a3a3a;
        color: #ccc;
      }

      #go-to-options-btn:hover {
        background: #333;
      }
    }

    /*tooltip*/
    .suggestion-card {
      position: relative;
    }

    .why-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid #e0e0e0;
      cursor: pointer;
      padding: 3px 8px;
      color: #999;
      font-size: 11px;
      border-radius: 4px;
      transition: color 0.12s, border-color 0.12s;
      margin-right: 4px;
    }

    .why-btn:hover {
      color: #444;
      border-color: #bbb;
    }

    .tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #1a1a1a;
      color: #f0f0f0;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      line-height: 1.45;
      z-index: 10;
      pointer-events: none;
    }

    .tooltip.visible {
      display: block;
    }

    .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 20px;
      border: 5px solid transparent;
      border-top-color: #1a1a1a;
    }

    @media (prefers-color-scheme: dark) {
      .why-btn {
        color: #666;
        border-color: #2e2e2e;
      }

      .why-btn:hover {
        color: #bbb;
        border-color: #555;
      }

      .tooltip {
        background: #f0f0f0;
        color: #1a1a1a;
      }

      .tooltip::after {
        border-top-color: #f0f0f0;
      }
    }

    /*domain detection*/
    #domain-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 4px;
      margin-top: 5px;
      background: #f0f0f0;
      color: #666;
    }

    @media (prefers-color-scheme: dark) {
      #domain-tag {
        background: #2a2a2c;
        color: #888;
      }
    }
  </style>
</head>

<body>
  <div id="header">
    <div id="header-top">
      <h1>QueryBridge</h1>
      <span id="result-count"></span>
    </div>
    <div id="original-query"></div>
    <div id="domain-tag" style="display:none"></div>
  </div>

  <div id="body">
    <div id="status"></div>
    <div id="suggestions"></div>
    <div id="error-box">
      <p id="error-msg">Something went wrong.</p>
      <button id="retry-btn">Try again</button>
    </div>

    <div id="no-key-box">
      <p>No API key found. Add your Gemini API key in settings to use QueryBridge.</p>
      <button id="go-to-options-btn">Open settings</button>
    </div>
  </div>


  <div id="footer"><button id="options-link">Settings</button></div>


  <script src="popup.js" defer></script>
</body>

</html>
